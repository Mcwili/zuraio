name: Deploy contact relay Worker

on:
  push:
    branches:
      - main
    paths:
      - 'workers/contact-relay/**'
      - '.github/workflows/deploy-contact-worker.yml'
  workflow_dispatch:

# Set repository variable CF_WORKER_DEPLOY=true and secret CLOUDFLARE_API_TOKEN to enable.
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.CF_WORKER_DEPLOY == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: workers/contact-relay/package-lock.json

      - name: Install Worker dependencies
        working-directory: workers/contact-relay
        run: npm install

      - name: Deploy Worker
        working-directory: workers/contact-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
